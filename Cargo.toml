[package]
name = "qwen3-asr-toolkit"
version = "0.1.0"
edition = "2024"
default-run = "qwen3-asr"

[[bin]]
name = "qwen3-asr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
futures = "0.3"
hound = "3.5"
indicatif = "0.18"
mime_guess = "2.0"
ndarray = "0.17.2"
once_cell = "1.21"
ort = { version = "2.0.0-rc.10", features = ["ndarray"] }
rand = "0.10.1"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
tokio = { version = "1.48", features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-indicatif = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
which = "8.0"
